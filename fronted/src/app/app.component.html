<nav *ngIf="isLoggedIn" class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" routerLink="/dashboard">Dashboard</a>
    
    <!-- Botón de hamburguesa para pantallas pequeñas -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard">Productos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/inventario">Inventario</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/ordenes">Órdenes</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/usuarios">Usuarios</a>
        </li>
      </ul>
    </div>

    <div class="navbar-text text-white me-3" *ngIf="isLoggedIn">
      <span [attr.value]="userId" class="text-white">{{ userName }}</span>
    </div>

    <!-- Botón de cerrar sesión alineado a la izquierda -->
    <button class="btn btn-outline-light ms-auto" (click)="logout()">Cerrar Sesión</button>
  </div>
</nav>

<!-- Contenido dinámico de las páginas -->
