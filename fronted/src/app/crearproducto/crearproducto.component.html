<div class="container mt-4">
    <h2 class="text-center">Crear Nuevo Producto</h2>
    
    <form [formGroup]="productoForm" (ngSubmit)="crearProducto()" class="mb-4">
      <div class="row">
        <div class="col-md-6">
          <input type="text" formControlName="nombre" class="form-control" placeholder="Nombre del Producto">
        </div>
        <div class="col-md-6">
          <input type="text" formControlName="descripcion" class="form-control" placeholder="Descripción">
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-md-4">
          <input type="number" formControlName="precio" class="form-control" placeholder="Precio">
        </div>
        <div class="col-md-4">
          <input type="text" formControlName="categoria" class="form-control" placeholder="Categoría">
        </div>
        <div class="col-md-4">
          <select formControlName="activo" class="form-control">
            <option [value]="true">Activo</option>
            <option [value]="false">Inactivo</option>
          </select>
        </div>
      </div>
      <div class="text-center mt-3">
        <button type="submit" class="btn btn-success" [disabled]="productoForm.invalid">Crear Producto</button>
      </div>
    </form>
  </div>
